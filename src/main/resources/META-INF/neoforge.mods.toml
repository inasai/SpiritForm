modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors = "Inasai"
logoFile="logo.png"
description='''
Turn into a spirit: fly, pass through blocks and fall without harm. Upgrade the form in three branches (Hunger, Movement, Darkness) with experience levels, and unlock invisibility and teleportation.
'''

[[mixins]]
config="spirit_form.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
